name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_args: --linux AppImage
            artifact_path: release/**/*.AppImage
          - os: windows-latest
            build_args: --win nsis
            artifact_path: release/**/*-Setup.exe
          - os: macos-latest
            build_args: --mac dmg
            artifact_path: release/**/*-Installer.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc
      - run: npx vite build
      - run: npx electron-builder ${{ matrix.build_args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: lisdiscord-${{ matrix.os }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publicar release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
