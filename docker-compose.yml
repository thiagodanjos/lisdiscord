# Corre o bot autónomo com "docker compose up -d". Cria um ficheiro .env
# ao lado deste ficheiro (ver .env.example) com o teu DISCORD_TOKEN antes
# de arrancar — ver docs/deploy-oracle.md para o guia passo a passo.
services:
  lisdiscord-bot:
    build: .
    container_name: lisdiscord-bot
    restart: unless-stopped
    env_file:
      - .env
    # Só é preciso expor a porta se ativares a API remota (LISDISCORD_API_KEY no .env) para gerir
    # o bot pela app desktop. Sem essa variável definida, a API fica desligada e esta porta não é usada.
    ports:
      - '8787:8787'
    volumes:
      - lisdiscord-data:/app/data

volumes:
  lisdiscord-data:
